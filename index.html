<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Body Explorer">
<meta name="theme-color" content="#8E7CFF">
<title>Lenny Bean's Body Explorer</title>
<style>
:root{--ink:#3b2a5a;--pink:#FF6FA3;--yellow:#FFD166;--teal:#3DD6C6;--purple:#7C6CF2;--blue:#4DB6FF;--green:#4CC38A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background:linear-gradient(160deg,#8E7CFF 0%,#6FB6FF 48%,#7FE3D4 100%)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cell{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),rgba(255,255,255,.12) 60%,rgba(255,255,255,0) 72%);animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) scale(.9)}to{transform:translateY(-30vh) scale(1.1)}}
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.icon-btn{position:relative;width:64px;height:64px;flex:none;border-radius:50%;border:none;background:#fff;box-shadow:0 5px 0 rgba(40,20,90,.18);font-size:30px;display:grid;place-items:center;padding:0}
.icon-btn:active,.big-btn:active,.level-card:active,.act-card:active,.opt:active,.o-card:active,.sys-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(40,20,90,.18)}
.icon-btn.hidden{visibility:hidden}
#title{font-size:clamp(20px,3.3vmin,32px);font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(40,20,90,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{background:#fff;border-radius:999px;padding:0 18px;height:56px;display:flex;align-items:center;font-weight:900;font-size:24px;box-shadow:0 5px 0 rgba(40,20,90,.18);white-space:nowrap}
#btnGrown{background:conic-gradient(var(--yellow) calc(var(--p,0) * 1turn),#fff 0)}
#btnGrown span{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px}
#guide{display:flex;align-items:center;gap:12px;padding:2px 16px 4px}
#pipWrap{flex:none}
#pipWrap svg{width:clamp(74px,11.5vmin,112px);height:auto;display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.pip-eyes{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#pipWrap.talk svg{animation:talk .35s ease-in-out 3}
@keyframes talk{50%{transform:scale(1.07) rotate(3deg)}}
#bubble{position:relative;background:#fff;border-radius:26px;padding:10px 12px 10px 20px;flex:1;display:flex;align-items:center;gap:12px;min-height:70px;box-shadow:0 6px 0 rgba(40,20,90,.12)}
#bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:16px solid #fff;border-left:0}
#bubbleText{flex:1;font-size:clamp(18px,2.7vmin,27px);font-weight:800;line-height:1.25}
.hear{flex:none;border:none;background:var(--yellow);border-radius:999px;padding:0 18px;height:60px;font-size:22px;font-weight:900;box-shadow:0 4px 0 #E0A83A;display:flex;align-items:center;gap:6px}
.hear:active{transform:translateY(3px);box-shadow:0 1px 0 #E0A83A}
#stage{flex:1;min-height:0;position:relative;padding:10px 16px 16px;display:flex;flex-direction:column}
.big-btn{border:none;border-radius:999px;background:var(--green);color:#fff;font-weight:900;font-size:clamp(22px,3.2vmin,30px);padding:0 30px;min-height:72px;box-shadow:0 6px 0 #2E9A68;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.big-btn.alt{background:var(--purple);box-shadow:0 6px 0 #5243C2}
.big-btn.pinkb{background:var(--pink);box-shadow:0 6px 0 #D84C82}
.big-btn.hidden,.hidden{display:none!important}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;min-height:0}
.logo{margin:0;text-align:center;color:#fff;font-size:clamp(38px,7.5vmin,76px);line-height:1;font-weight:900;text-shadow:0 4px 0 #5a46c8,0 10px 20px rgba(0,0,0,.18)}
.logo small{display:block;font-size:.42em;color:#FFE38A;margin-bottom:6px;text-shadow:0 3px 0 #5a46c8}
.levels{display:flex;gap:2.5vmin;justify-content:center}
.level-card{position:relative;width:clamp(200px,28vmin,290px);border:none;border-radius:32px;padding:18px 14px;background:#fff;box-shadow:0 8px 0 rgba(40,20,90,.18);display:flex;flex-direction:column;align-items:center;gap:6px;border-top:14px solid var(--c)}
.lv-emoji{font-size:clamp(54px,9vmin,90px);line-height:1.1}
.lv-name{font-size:clamp(22px,3.3vmin,32px);font-weight:900}
.lv-age{font-size:18px;font-weight:800;opacity:.65}
.lv-stars{font-size:20px;font-weight:900;background:#FFF5D1;border-radius:999px;padding:4px 14px}
.lv-now{position:absolute;top:-30px;right:-6px;background:var(--yellow);border-radius:999px;padding:4px 12px;font-weight:900;font-size:16px;transform:rotate(6deg);box-shadow:0 3px 0 #E0A83A}
.lv-text{display:flex;flex-direction:column;align-items:center;gap:6px}
@media (orientation:portrait){
  .levels{flex-direction:column;width:min(88vw,560px)}
  .level-card{width:100%;flex-direction:row;justify-content:flex-start;gap:16px;padding:14px 22px;border-top:none;border-left:16px solid var(--c);text-align:left}
  .level-card .lv-text{align-items:flex-start;gap:4px;flex:1}
  .lv-now{top:-12px}
}
.map{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;min-height:0}
.map h2{margin:0;color:#fff;font-size:clamp(28px,5vmin,46px);text-shadow:0 3px 0 rgba(40,20,90,.25)}
.acts{display:flex;flex-wrap:wrap;gap:2.4vmin;justify-content:center;max-width:1000px}
.act-card{width:clamp(150px,22vmin,200px);aspect-ratio:1/1.12;border:none;border-radius:34px;background:#fff;box-shadow:0 8px 0 rgba(40,20,90,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;animation:popIn .5s backwards;animation-delay:calc(var(--i) * .08s)}
.act-emoji{width:70%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(46px,7vmin,66px);background:radial-gradient(circle at 35% 30%,#fff,var(--c) 75%)}
.act-emoji svg{width:70%;height:70%}
.act-name{font-size:clamp(17px,2.4vmin,22px);font-weight:900;text-align:center;line-height:1.1}
.stars{font-size:clamp(20px,3vmin,28px);letter-spacing:2px}
.stars .on{color:#FFC21A;text-shadow:0 2px 0 #E09A00}.stars .off{color:#E4DDF2}
@keyframes popIn{from{transform:scale(.4);opacity:0}}
.split{flex:1;display:flex;gap:16px;min-height:0}
.figure{position:relative;flex:1.15;min-height:0;background:rgba(255,255,255,.4);border-radius:34px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.6)}
.figure>svg{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.side{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:stretch;min-width:0}
@media (orientation:portrait){.split{flex-direction:column}.figure{flex:1}.side{flex:none}}
.info-card{background:#fff;border-radius:30px;padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 6px 0 rgba(40,20,90,.12);min-height:180px;justify-content:center}
@media (orientation:portrait){.info-card{flex-direction:row;text-align:left;min-height:120px;gap:16px}.info-card .info-body{flex:1}}
.info-emoji{font-size:clamp(56px,9vmin,84px);line-height:1;width:clamp(70px,11vmin,100px);height:clamp(70px,11vmin,100px);display:grid;place-items:center;flex:none}
.info-emoji svg{width:100%;height:100%}
.info-name{font-size:clamp(28px,4.4vmin,44px);font-weight:900;color:var(--purple)}
.info-text{font-size:clamp(18px,2.6vmin,24px);font-weight:700;line-height:1.3}
.pop{animation:popIn .35s}
.progress{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px}
.progress .dot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 3px rgba(255,255,255,.9)}
.progress .dot.on{background:var(--yellow);box-shadow:0 2px 0 #E0A83A}
.progress .dot.cur{background:#fff;transform:scale(1.25)}
.part{cursor:pointer;transform-box:fill-box;transform-origin:center}
.part.glow{filter:url(#glowF);animation:bump .45s}
@keyframes bump{40%{transform:scale(1.08)}}
.part.wig{animation:wig .45s}
@keyframes wig{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.quiz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;min-height:0}
.q-text{background:#fff;border-radius:28px;padding:12px 26px;font-size:clamp(24px,4vmin,40px);font-weight:900;text-align:center;box-shadow:0 6px 0 rgba(40,20,90,.12);max-width:96%}
.q-pic{font-size:clamp(60px,11vmin,110px);line-height:1;filter:drop-shadow(0 6px 0 rgba(40,20,90,.15))}
.opts{display:flex;gap:2.6vmin;justify-content:center;flex-wrap:wrap}
.opt{position:relative;width:clamp(150px,23vmin,220px);height:clamp(160px,25vmin,240px);border:none;border-radius:34px;background:#fff;box-shadow:0 8px 0 rgba(40,20,90,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:clamp(64px,11vmin,104px);line-height:1}
.opt svg{width:70%;height:62%}
.opt-label{font-size:clamp(18px,2.6vmin,24px);font-weight:900}
.opt.right{background:#D7FBE6;box-shadow:0 0 0 6px var(--green),0 8px 0 #2E9A68;animation:bump .5s}
.opt.wrong{opacity:.35;animation:shake .45s}
.opt.right::after{content:"✔";position:absolute;top:-14px;right:-10px;background:var(--green);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px}
.opts.text{flex-direction:column;align-items:center;gap:14px;width:min(92%,640px)}
.opts.text .opt{width:100%;height:auto;min-height:76px;flex-direction:row;justify-content:flex-start;padding:10px 24px;font-size:36px;gap:18px;border-radius:26px}
.opts.text .opt-label{font-size:clamp(20px,3vmin,28px);text-align:left}
.num{font-size:1em;font-weight:900;color:var(--purple)}
.dots{font-size:22px;color:var(--pink);letter-spacing:4px}
.q-fact{background:#FFF5D1;border-radius:22px;padding:12px 22px;font-size:clamp(18px,2.6vmin,24px);font-weight:800;max-width:min(92%,760px);text-align:center;box-shadow:0 4px 0 #EBD48C}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.shake{animation:shake .45s}
.dm{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.dm-targets{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.dm.two .dm-targets{grid-template-columns:1fr 1fr}
.dm-target{background:rgba(255,255,255,.88);border-radius:28px;border:5px dashed var(--c);display:flex;flex-direction:column;align-items:center;padding:10px 8px;gap:6px;transition:transform .15s,background .15s;min-height:0;overflow:hidden}
.dm-target.hover{background:#FFF7D6;transform:scale(1.04);border-style:solid}
.dm-t-head{display:flex;flex-direction:column;align-items:center;font-size:clamp(46px,7vmin,70px);line-height:1}
.dm-t-head:empty{display:none}
.dm-t-label{font-size:clamp(17px,2.5vmin,24px);font-weight:900;text-align:center;line-height:1.1;margin-top:4px}
.dm-t-sub{font-size:15px;font-weight:700;opacity:.7;text-align:center}
.dm-drop{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;flex:1}
.dm-tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;background:rgba(255,255,255,.35);border-radius:28px;padding:12px;min-height:150px}
.dm-item{width:clamp(108px,15vmin,136px);height:clamp(108px,15vmin,136px);background:#fff;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(46px,7vmin,62px);line-height:1;box-shadow:0 6px 0 rgba(40,20,90,.18);touch-action:none;cursor:grab;padding:6px;transition:transform .15s}
.dm-item svg{width:62%;height:56%}
.dm-i-label{font-size:clamp(14px,2vmin,17px);font-weight:900;text-align:center;line-height:1.05;margin-top:4px}
.dm-item.dragging{opacity:.25}
.dm-item.selected{box-shadow:0 0 0 6px var(--yellow),0 6px 0 rgba(40,20,90,.18);transform:scale(1.07)}
.dm-drop .dm-item{width:64px;height:64px;font-size:34px;box-shadow:0 3px 0 rgba(40,20,90,.15);cursor:default;animation:popIn .3s}
.dm-drop .dm-item .dm-i-label{display:none}
.ghost{position:fixed!important;z-index:999;pointer-events:none;transform:scale(1.12) rotate(-5deg);box-shadow:0 18px 26px rgba(0,0,0,.25)!important;margin:0}
.order{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;min-height:0}
.path{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(96px,14vmin,130px);height:clamp(110px,16vmin,148px);border-radius:24px;border:5px dashed rgba(255,255,255,.95);background:rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(40px,6vmin,56px);position:relative}
.slot svg{width:66%;height:52%}
.slot.filled{background:#fff;border-style:solid;border-color:var(--green);animation:bump .4s}
.slot-n{position:absolute;top:-14px;left:-10px;width:36px;height:36px;border-radius:50%;background:var(--purple);color:#fff;font-size:20px;font-weight:900;display:grid;place-items:center}
.slot .s-label{font-size:clamp(13px,1.8vmin,16px);font-weight:900;text-align:center;line-height:1.05}
.arrow{font-size:30px;color:#fff;font-weight:900}
.o-tray{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.o-card{width:clamp(120px,17vmin,160px);height:clamp(130px,18vmin,170px);border:none;border-radius:28px;background:#fff;box-shadow:0 8px 0 rgba(40,20,90,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:clamp(46px,7vmin,64px);line-height:1;padding:8px}
.o-card svg{width:66%;height:56%}
.o-card span{font-size:clamp(16px,2.2vmin,20px);font-weight:900}
.o-card.used{visibility:hidden}
.wash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:10px}
.hands-wrap{position:relative}
.hands-wrap>svg{position:absolute;inset:0;width:100%;height:100%}
.germ{position:absolute;width:clamp(66px,10vmin,96px);height:clamp(66px,10vmin,96px);transform:translate(-50%,-50%);border:none;background:none;padding:0;animation:wobble 1.6s ease-in-out infinite}
.germ svg{width:100%;height:100%}
.germ.gone{animation:poof .5s forwards;pointer-events:none}
@keyframes wobble{50%{transform:translate(-50%,-50%) rotate(8deg) scale(1.06)}}
@keyframes poof{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(180,230,255,.6) 50%,rgba(140,200,255,.25));border:2px solid rgba(255,255,255,.9);pointer-events:none;animation:bubUp 1.4s ease-out forwards}
@keyframes bubUp{to{transform:translateY(-120px) scale(1.3);opacity:0}}
.sys-grid{flex:1.15;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:0}
.sys-card{border:none;border-radius:26px;background:var(--c);box-shadow:0 6px 0 rgba(40,20,90,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;font-size:clamp(40px,6.5vmin,60px);line-height:1;position:relative}
.sys-card svg{width:clamp(48px,8vmin,72px);height:clamp(48px,8vmin,72px)}
.sys-card span{font-size:clamp(15px,2.2vmin,20px);font-weight:900;text-align:center}
.sys-card.seen::after{content:"✔";position:absolute;top:8px;right:10px;background:var(--green);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.sys-card.active{box-shadow:0 0 0 5px var(--purple),0 6px 0 rgba(40,20,90,.15)}
.facts{margin:6px 0 0;padding-left:22px;text-align:left;font-size:clamp(17px,2.3vmin,21px);font-weight:700;line-height:1.3}
.facts li{margin:4px 0}
.side .info-card.sys{align-items:stretch;text-align:left;flex-direction:column}
@media (orientation:portrait){.sys-grid{flex:none;height:40%}}
.modal{position:fixed;inset:0;background:rgba(40,20,80,.45);display:grid;place-items:center;z-index:50;padding:20px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.card{background:#fff;border-radius:38px;padding:26px 30px;width:min(92vw,640px);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 12px 0 rgba(40,20,90,.2);animation:popIn .35s}
.card h2{margin:6px 0 10px;font-size:clamp(30px,5vmin,44px);color:var(--purple)}
.big-stars{font-size:clamp(60px,11vmin,96px);display:flex;justify-content:center;gap:8px}
.big-stars span{animation:popIn .5s backwards}
.big-stars .on{color:#FFC21A;text-shadow:0 4px 0 #E09A00}.big-stars .off{color:#E9E3F5}
.sticker{display:inline-grid;place-items:center;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FFE38A);font-size:62px;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--pink);animation:spinIn .8s}
@keyframes spinIn{from{transform:rotate(-200deg) scale(0)}}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px;margin-top:10px}
.book .slot2{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:15px;border:none;background:none;padding:4px}
.book .sticker{width:80px;height:80px;font-size:44px;animation:none}
.book .locked .sticker{background:#EEE9F7;box-shadow:0 0 0 5px #fff,0 0 0 8px #DDD3EE;opacity:.6}
.grown h3{margin:10px 0 6px;font-size:20px}
.grown{padding:18px 24px}
.grown .row{margin-top:12px}
.seg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seg button{border:none;border-radius:20px;padding:12px 18px;min-height:60px;font-size:19px;font-weight:900;background:#F0ECFA;box-shadow:0 4px 0 #D9D0EE}
.seg button.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 #5243C2}
.danger{background:#FFE1E1!important;color:#C0392B!important;box-shadow:0 4px 0 #F1B6B6!important}
.danger.armed{background:#E74C3C!important;color:#fff!important}
.note{font-size:15px;opacity:.7;margin-top:14px;line-height:1.35}
.toast{position:fixed;left:50%;top:86px;transform:translateX(-50%);background:#3b2a5a;color:#fff;border-radius:999px;padding:12px 22px;font-weight:800;font-size:18px;z-index:60;animation:fadeIn .2s}
#splash{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;background:linear-gradient(160deg,#8E7CFF 0%,#6FB6FF 48%,#7FE3D4 100%)}
#splash .pipbig svg{width:clamp(160px,30vmin,280px);height:auto;animation:bob 3s ease-in-out infinite}
.confetti{position:fixed;top:-60px;z-index:70;pointer-events:none;font-size:32px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header id="top">

function startAct(id){reset();const a=ACTS[id];cur={id,mistakes:0};setTop(a.name,showMap,'⬅️');stage.dataset.act=id;a.run();}
function mistake(){if(cur)cur.mistakes++;}
function finishAct(){
  if(!cur||cur.done)return;cur.done=1;const id=cur.id,a=ACTS[id];
  const stars=levelOf(id)==='little'?3:(cur.mistakes<=1?3:cur.mistakes<=3?2:1);
  S.stars[id]=Math.max(S.stars[id]||0,stars);
  const fresh=S.stickers.indexOf(id)<0;if(fresh)S.stickers.push(id);
  save();updateTop();SFX.win();confetti();
  const msg=pick(['Amazing job, Lenny Bean!','You did it, Lenny Bean!','Super exploring!','Wow, what a great explorer!']);
  say(msg+(fresh?' You earned a new sticker!':''));
  const m=openModal(`<div class="card"><div class="big-stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':'off'}" style="animation-delay:${.15+i*.2}s">★</span>`).join('')}</div><h2>${msg}</h2>

function openModal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=html;document.body.appendChild(m);return m;}
function closeModal(){const m=$('#modal');if(m)m.remove();}
function confetti(){const e=['⭐','🎉','💖','✨','🌟','🎈'];for(let i=0;i<34;i++){const d=document.createElement('div');d.className='confetti';d.textContent=pick(e);d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.8+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.5+'s';d.style.fontSize=(22+Math.random()*24)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),4200);}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function progress(el,total,done,curI){el.innerHTML=Array.from({length:total},(_,i)=>`<span class="dot ${i<done?'on':(i===curI?'cur':'')}"></span>`).join('');}
function partEls(id){return $$(`.figure [data-part="${id}"]`);}
function glow(id){$$('.figure .part.glow').forEach(p=>p.classList.remove('glow'));partEls(id).forEach(p=>{void p.getBoundingClientRect();p.classList.add('glow');});}
function wiggle(id){partEls(id).forEach(p=>{p.classList.remove('wig');void p.getBoundingClientRect();p.classList.add('wig');});}
function shakeEl(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

/* ---------- engine: tap to explore ---------- */
function exploreBody(svg,parts,intro,doneMsg){
  say(intro);
  stage.innerHTML=`<div class="split"><div class="figure">${svg}</div><div class="side"><div class="info-card" id="info"><div class="info-emoji">👆</div><div class="info-body"><div class="info-name">Tap a part!</div><div class="info-text"></div></div></div><div class="progress" id="prog"></div><div style="text-align:center"><button class="big-btn pulse hidden" id="doneBtn">✅ All done!</button></div></div></div>`;
  const ids=Object.keys(parts),seen=new Set(),prog=$('#prog');
  const draw=()=>progress(prog,ids.length,seen.size);draw();
  $$('.figure .part').forEach(el=>onTap(el,()=>{
    const id=el.dataset.part,p=parts[id];if(!p)return;
    SFX.pop();glow(id);seen.add(id);draw();
    const info=$('#info');info.innerHTML=`<div class="info-emoji">${p.icon}</div><div class="info-body"><div class="info-name">${p.name}</div><div class="info-text">${p.fact}</div></div>`;
    info.classList.remove('pop');void info.offsetWidth;info.classList.add('pop');
    say(`${p.name}! ${p.fact}`);
    if(seen.size>=Math.ceil(ids.length*.6))$('#doneBtn').classList.remove('hidden');
    if(seen.size===ids.length&&!cur.allSeen){cur.allSeen=1;later(()=>say(doneMsg),readMs(p.fact)+400);}
  }));
  onTap($('#doneBtn'),()=>{SFX.tap();finishAct();});
}
/* ---------- engine: find the part ---------- */
function findGame(svg,parts,rounds){
  stage.innerHTML=`<div class="split"><div class="figure">${svg}</div><div class="side"><div class="info-card"><div class="info-emoji" id="fIcon">🔍</div><div class="info-body"><div class="info-name" id="fName"></div><div class="info-text">Tap it on the picture!</div></div></div><div class="progress" id="prog"></div></div></div>`;
  const order=shuffle(Object.keys(parts).filter(k=>!parts[k].nofind)).slice(0,rounds);let r=0,locked=false;
  const ask=()=>{const id=order[r],p=parts[id];stage.dataset.target=id;$('#fIcon').innerHTML=p.icon;$('#fName').textContent='Find the '+p.name.toLowerCase()+'!';progress($('#prog'),order.length,r,r);say(`Can you find the ${p.name.toLowerCase()}?`);};
  $$('.figure .part').forEach(el=>onTap(el,()=>{
    if(locked||r>=order.length)return;const id=el.dataset.part,target=order[r],p=parts[id];if(!p)return;
    if(id===target){locked=true;SFX.good();glow(id);say(`${pick(PRAISE)} ${p.plural?'Those are':'That is'} the ${p.name.toLowerCase()}!`);
      later(()=>{locked=false;r++;if(r>=order.length){progress($('#prog'),order.length,r);finishAct();}else ask();},2300);}
    else{mistake();SFX.oops();wiggle(id);say(`${p.plural?'Those are':'That is'} the ${p.name.toLowerCase()}. Can you find the ${parts[target].name.toLowerCase()}?`);}
  }));
  ask();
}
/* ---------- engine: quiz ---------- */
function quiz(questions,opt){
  opt=opt||{};let i=0,locked=false;
  stage.innerHTML=`<div class="quiz"><div class="q-text" id="qText"></div><div class="q-pic hidden" id="qPic"></div><div class="opts ${opt.text?'text':''}" id="opts"></div><div class="q-fact hidden" id="qFact"></div><button class="big-btn hidden" id="qNext">Next ➜</button><div class="progress" id="prog"></div></div>`;
  const next=()=>{i++;if(i>=questions.length){progress($('#prog'),questions.length,i);finishAct();}else show();};
  function show(){
    const Q=questions[i];locked=false;$('#qText').textContent=Q.q;
    const pic=$('#qPic');pic.classList.toggle('hidden',!Q.pic);pic.innerHTML=Q.pic||'';
    $('#qFact').classList.add('hidden');$('#qNext').classList.add('hidden');progress($('#prog'),questions.length,i,i);
    say(Q.q);
    const shown=shuffle(Q.opts);const box=$('#opts');box.innerHTML=shown.map(o=>`<button class="opt" data-label="${o.label}">${o.html}<span class="opt-label">${o.label}</span></button>`).join('');
    $$('.opt',box).forEach((b,bi)=>onTap(b,()=>{
      if(locked||b.classList.contains('wrong'))return;
      if(shown[bi].ok){locked=true;b.classList.add('right');SFX.good();const msg=pick(PRAISE)+' '+(Q.fact||'');say(msg);
        if(Q.fact){const f=$('#qFact');f.textContent='💡 '+Q.fact;f.classList.remove('hidden');}
        if(opt.autoNext)later(next,readMs(msg));else $('#qNext').classList.remove('hidden');}
      else{mistake();b.classList.add('wrong');SFX.oops();say(pick(TRY)+(opt.sayWrong?` That is the ${b.dataset.label.toLowerCase()}.`:''));}
    }));
  }
  onTap($('#qNext'),()=>{SFX.tap();next();});
  show();
}
/* ---------- engine: drag & drop (or tap-then-tap) match ---------- */
function dragMatch(targets,items,cls,doneMsg){
  stage.innerHTML=`<div class="dm ${cls||''}"><div class="dm-targets">${targets.map(t=>`<div class="dm-target" data-t="${t.id}" style="--c:${t.c}"><div class="dm-t-head">${t.html}</div><div class="dm-t-label">${t.label}</div>${t.sub?`<div class="dm-t-sub">${t.sub}</div>`:''}<div class="dm-drop"></div></div>`).join('')}</div>
  <div class="dm-tray">${shuffle(items).map(it=>`<div class="dm-item" data-k="${items.indexOf(it)}" data-t="${it.t}">${it.html}<div class="dm-i-label">${it.label}</div></div>`).join('')}</div></div>`;
  let left=items.length,sel=null;
  const clearHover=()=>$$('.dm-target.hover').forEach(t=>t.classList.remove('hover'));
  const targetAt=(x,y)=>{const n=document.elementFromPoint(x,y);return n&&n.closest?n.closest('.dm-target'):null;};
  function tryDrop(el,t){
    const it=items[+el.dataset.k];
    if(el.dataset.t===t.dataset.t){
      el.classList.remove('selected');sel=null;$('.dm-drop',t).appendChild(el);el.style.pointerEvents='none';
      SFX.good();left--;
      if(left===0){const m=it.fb+' '+doneMsg;say(m);later(finishAct,readMs(m));}else say(it.fb);
    }else{mistake();SFX.oops();shakeEl(el);shakeEl(t);el.classList.remove('selected');sel=null;say(pick(TRY));}
  }
  $$('.dm-item').forEach(el=>el.addEventListener('pointerdown',e=>{
    if(el.parentNode.classList.contains('dm-drop'))return;
    e.preventDefault();ac();const it=items[+el.dataset.k];
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;let moved=false,ghost=null;
    const move=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10){moved=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.classList.remove('selected');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);el.classList.add('dragging');SFX.tap();speak(it.label);}
      if(moved){ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';clearHover();const t=targetAt(ev.clientX,ev.clientY);if(t)t.classList.add('hover');}
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      clearHover();el.classList.remove('dragging');if(ghost)ghost.remove();
      if(!moved){
        if(sel===el){el.classList.remove('selected');sel=null;return;}
        if(sel)sel.classList.remove('selected');sel=el;el.classList.add('selected');SFX.tap();say(it.label+'! Now tap where it goes.');return;}
      const t=ev.type==='pointerup'?targetAt(ev.clientX,ev.clientY):null;if(t)tryDrop(el,t);
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  }));
  $$('.dm-target').forEach(t=>onTap(t,()=>{if(sel)tryDrop(sel,t);}));
}

/* ---------- Little Explorer ---------- */
function actTapLearn(){exploreBody(KID_SVG,LITTLE_PARTS,'Tap a body part to hear its name!','You found every part! Tap All done when you are ready.');}
function actFindPart(){findGame(KID_SVG,LITTLE_PARTS,5);}
function actUse(){
  const qs=shuffle(USE_Q).slice(0,5).map(([q,ans,fact])=>{const others=shuffle(Object.keys(USE_OPTS).filter(k=>k!==ans)).slice(0,2);
    return {q,fact,opts:[ans].concat(others).map(k=>({html:USE_OPTS[k][0],label:USE_OPTS[k][1],ok:k===ans}))};});
  quiz(qs,{autoNext:true,sayWrong:true});
}
function actCount(){
  const qs=shuffle(COUNT_Q).slice(0,5).map(c=>({q:c.q,pic:c.pic,fact:c.fact,opts:c.opts.map(n=>({html:`<div class="num">${n}</div><div class="dots">${'●'.repeat(n)}</div>`,label:NUMW[n],ok:n===c.ans}))}));
  quiz(qs,{autoNext:true});
}
function actWash(){
  say('Oh no, silly germs! Tap them to wash them away with soap bubbles.');
  const spots=shuffle([[100,180],[76,228],[132,226],[58,74],[116,62],[300,180],[324,228],[268,226],[342,74],[284,62]]).slice(0,8);
  const cols=[['#9BE58B','#5DB04C'],['#C7A6FF','#8E68E0'],['#FFC27A','#E39235'],['#8FD8FF','#3FA6DD']];
  stage.innerHTML=`<div class="wash"><div class="hands-wrap" id="hw">${HANDS_SVG}${spots.map(([x,y],i)=>{const c=cols[i%4];return `<button class="germ" style="left:${x/4}%;top:${y/3}%;animation-delay:${i*.15}s" aria-label="germ">${germSVG(c[0],c[1])}</button>`;}).join('')}</div><div class="progress" id="prog"></div></div>`;
  let left=spots.length;const prog=$('#prog');progress(prog,spots.length,0);
  const hw=$('#hw');
  const fit=()=>{if(!hw.isConnected){window.removeEventListener('resize',fit);return;}const r=stage.getBoundingClientRect();const w=Math.max(200,Math.min(r.width-40,(r.height-80)*4/3));hw.style.width=w+'px';hw.style.height=(w*.75)+'px';};
  fit();window.addEventListener('resize',fit);
  $$('.germ').forEach(g=>onTap(g,()=>{
    if(g.classList.contains('gone'))return;g.classList.add('gone');SFX.pop();
    for(let k=0;k<4;k++){const b=document.createElement('div');b.className='bub';const s=14+Math.random()*26;b.style.width=b.style.height=s+'px';b.style.left=`calc(${g.style.left} + ${(Math.random()*60-30).toFixed(0)}px)`;b.style.top=`calc(${g.style.top} + ${(Math.random()*30-15).toFixed(0)}px)`;b.style.animationDelay=k*.08+'s';hw.appendChild(b);setTimeout(()=>b.remove(),1700);}
    left--;progress(prog,spots.length,spots.length-left);
    if(left>0){say(pick(['Pop!','Bye bye, germ!','Scrub scrub!','Bubbles!','Splish splash!']));}
    else{const m='Sparkly clean hands! Soap and water wash germs away. Scrub for 20 seconds, as long as singing Happy Birthday two times!';say(m);later(finishAct,readMs(m)-1500);}
  }));
}
/* ---------- Big Explorer ---------- */
function actSenses(){
  say('Drag each thing to the sense you use for it. Or tap it, then tap the sense.');
  const items=SENSES.map(s=>pick(SENSE_ITEMS.filter(i=>i.t===s.id)));
  dragMatch(SENSES.map(s=>({id:s.id,html:s.html,label:s.label,c:s.c})),items,'','You know all five senses!');
}
function actInside(){exploreBody(ORGAN_SVG,ORGANS,'Peek inside! Tap each organ to learn what it does.','You explored every organ! Tap All done when you are ready.');}
function actFindOrgan(){findGame(ORGAN_SVG,ORGANS,5);}
function actOrganQuiz(){
  const qs=shuffle(ORGAN_Q).map(q=>({q:q.q,fact:q.fact,opts:q.opts.map(k=>({html:icon(k),label:ORGANS[k].name,ok:k===q.ans}))}));
  quiz(qs,{autoNext:true,sayWrong:true});
}
function actHabits(){
  say('Is it a healthy habit? Drag each card to the right box.');
  const items=shuffle(HABITS.filter(h=>h.t==='yes')).slice(0,3).concat(shuffle(HABITS.filter(h=>h.t==='no')).slice(0,3));
  dragMatch([{id:'yes',html:'💚',label:'Healthy habit',c:'#4CC38A'},{id:'no',html:'🙈',label:'Not so healthy',c:'#FF8FAB'}],items,'two','You know lots of healthy habits!');
}
/* ---------- Super Explorer ---------- */
function actSystems(){
  say('Your body has teams of parts that work together, called systems. Tap each one to learn about it.');
  stage.innerHTML=`<div class="split"><div class="sys-grid">${SYSTEMS.map(s=>`<button class="sys-card" data-s="${s.id}" style="--c:${s.c}">${s.icon}<span>${s.name}</span></button>`).join('')}</div><div class="side"><div class="info-card sys" id="info"><div class="info-name" style="text-align:center">Pick a system!</div><div class="info-text" style="text-align:center">Six body teams to discover.</div></div><div style="text-align:center"><button class="big-btn pulse hidden" id="doneBtn">✅ All done!</button></div></div></div>`;
  const seen=new Set();
  $$('.sys-card').forEach(b=>onTap(b,()=>{
    const s=SYSTEMS.find(x=>x.id===b.dataset.s);SFX.pop();seen.add(s.id);b.classList.add('seen');
    $$('.sys-card').forEach(c=>c.classList.toggle('active',c===b));
    const info=$('#info');info.innerHTML=`<div class="info-name">${s.name}</div><div style="font-weight:800;opacity:.6;font-size:18px">${s.full}</div><ul class="facts">${s.facts.map(f=>`<li>${f}</li>`).join('')}</ul>`;
    info.classList.remove('pop');void info.offsetWidth;info.classList.add('pop');
    say(`The ${s.full}. `+s.facts.join(' '));
    if(seen.size===SYSTEMS.length)$('#doneBtn').classList.remove('hidden');
  }));
  onTap($('#doneBtn'),()=>{SFX.tap();finishAct();});
}
function actFood(){
  say("Where does food go after you take a bite? Tap the parts in order, starting with the first stop.");
  stage.innerHTML=`<div class="order"><div class="path">${FOOD_STEPS.map((s,i)=>`<div class="slot" data-i="${i}"><span class="slot-n">${i+1}</span></div>`).join('<div class="arrow">➜</div>')}</div><div class="q-fact" id="oFact">🍎 Tap the first stop!</div><div class="o-tray">${shuffle(FOOD_STEPS).map(s=>`<button class="o-card" data-id="${s.id}" data-n="${FOOD_STEPS.indexOf(s)}">${s.html}<span>${s.label}</span></button>`).join('')}</div></div>`;
  let n=0,locked=false;
  $$('.o-card').forEach(c=>onTap(c,()=>{
    if(locked||c.classList.contains('used'))return;
    if(+c.dataset.n===n){const s=FOOD_STEPS[n];const slot=$(`.slot[data-i="${n}"]`);slot.innerHTML=`<span class="slot-n">${n+1}</span>${s.html}<span class="s-label">${s.label}</span>`;slot.classList.add('filled');c.classList.add('used');SFX.good();$('#oFact').textContent='✅ '+s.fact;n++;
      if(n===FOOD_STEPS.length){locked=true;const m=s.fact+' You followed food all the way through!';say(m);later(finishAct,readMs(m));}else say(s.fact);}
    else{mistake();SFX.oops();shakeEl(c);say(n===0?'Hmm, where does food go first?':`Not yet! What comes after the ${FOOD_STEPS[n-1].label.toLowerCase()}?`);}
  }));
}
function actMatch(){
  say('Which team does each part belong to? Drag it to its body system.');
  const T=[['circulatory','Circulatory','moves blood'],['respiratory','Respiratory','breathing'],['nervous','Nervous','sends messages'],['digestive','Digestive','breaks down food'],['skeletal','Skeletal','bones'],['muscular','Muscular','movement']];
  const cs=['#FF6B6B','#4DB6FF','#9B8CFF','#FF9F1C','#C9A66B','#FF6FA3'];
  const items=[{html:icon('heart'),label:'Heart',t:'circulatory',fb:'Yes! The heart is part of the circulatory system.'},{html:icon('lungs'),label:'Lungs',t:'respiratory',fb:'Yes! The lungs are part of the respiratory system.'},{html:icon('brain'),label:'Brain',t:'nervous',fb:'Yes! The brain is the center of the nervous system.'},{html:icon('stomach'),label:'Stomach',t:'digestive',fb:'Yes! The stomach is part of the digestive system.'},{html:'🦴',label:'Bones',t:'skeletal',fb:'Yes! Bones make up the skeletal system.'},{html:'💪',label:'Biceps',t:'muscular',fb:'Yes! The biceps is a muscle in your arm.'}];
  dragMatch(T.map((t,i)=>({id:t[0],html:'',label:t[1],sub:t[2],c:cs[i]})),items,'','You matched every system!');
}
function actQuiz(){
  const qs=shuffle(SUPER_Q).slice(0,8).map(q=>({q:q.q,fact:q.fact,opts:q.o.map(o=>({html:o[1],label:o[0],ok:!!o[2]}))}));
  quiz(qs,{text:true});
}

/* ---------- grown-up area (press and hold) ---------- */
(function(){
  const b=$('#btnGrown');let start=0,raf=0;
  const cancel=()=>{if(!start)return;cancelAnimationFrame(raf);b.style.setProperty('--p',0);if(performance.now()-start<1800)toast('Grown-ups: press and hold ⚙️');start=0;};
  b.addEventListener('pointerdown',e=>{e.preventDefault();start=performance.now();const tick=()=>{if(!start)return;const p=Math.min(1,(performance.now()-start)/1800);b.style.setProperty('--p',p);if(p>=1){start=0;b.style.setProperty('--p',0);openGrown();}else raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,cancel));
  b.addEventListener('contextmenu',e=>e.preventDefault());
})();
function openGrown(){
  try{speechSynthesis.cancel();}catch(e){}
  const m=openModal(`<div class="card grown"><h2>👋 Grown-up Corner</h2>
   <h3>Level</h3><div class="seg" id="gLevel">${LEVELS.map(l=>`<button data-l="${l.id}" class="${S.level===l.id?'on':''}">${l.emoji} ${l.name}<br><small>ages ${l.ages} · ⭐ ${levelStars(l.id)}/${l.acts.length*3}</small></button>`).join('')}</div>
   <h3>Sound</h3><div class="seg"><button id="gSfx" class="${S.muted?'':'on'}">🔊 Sound ${S.muted?'off':'on'}</button><button id="gVoice" class="${S.voice?'on':''}">🗣️ Read aloud ${S.voice?'on':'off'}</button><button id="gSlow" class="${S.slow?'on':''}">🐢 Slow voice ${S.slow?'on':'off'}</button></div>
   <h3>Progress</h3><div style="font-weight:800">⭐ ${totalStars()} stars · 📒 ${S.stickers.length} of ${Object.keys(ACTS).length} stickers</div>
   <div class="seg" style="margin-top:10px"><button id="gReset" class="danger">🗑️ Reset progress</button></div>
   <div class="row"><button class="big-btn" id="gClose">Done</button></div>
   <div class="note">Progress is saved on this device. Little Explorer always awards 3 stars; Big and Super Explorer award 1–3 stars based on tries. Tip: in Safari use Share → Add to Home Screen for a full-screen app.</div></div>`);
  $$('#gLevel button',m).forEach(b=>onTap(b,()=>{S.level=b.dataset.l;save();openGrown();}));
  onTap($('#gSfx',m),()=>{S.muted=!S.muted;save();updateTop();openGrown();});
  onTap($('#gVoice',m),()=>{S.voice=!S.voice;save();openGrown();});
  onTap($('#gSlow',m),()=>{S.slow=!S.slow;save();openGrown();});
  const r=$('#gReset',m);let armed=false;
  onTap(r,()=>{if(!armed){armed=true;r.classList.add('armed');r.textContent='Tap again to erase all stars & stickers';setTimeout(()=>{if(r.isConnected){armed=false;r.classList.remove('armed');r.textContent='🗑️ Reset progress';}},4000);return;}
    S.stars={};S.stickers=[];save();updateTop();toast('Progress reset');openGrown();});
  onTap($('#gClose',m),()=>{closeModal();showMap();});
}

/* ---------- boot ---------- */
(function(){
  const bg=$('#bg');for(let i=0;i<14;i++){const c=document.createElement('div');c.className='cell';const s=40+Math.random()*130;c.style.width=c.style.height=s+'px';c.style.left=Math.random()*100+'vw';c.style.animationDuration=(18+Math.random()*22)+'s';c.style.animationDelay=(-Math.random()*40)+'s';bg.appendChild(c);}
  $('#pipWrap').innerHTML=PIP;$('.pipbig').innerHTML=PIP;updateTop();
  onTap($('#btnStart'),()=>{ac();SFX.good();$('#splash').remove();showHome();});
  document.addEventListener('gesturestart',e=>e.preventDefault());
})();
</script>
